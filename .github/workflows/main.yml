name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Compile Java
      run: javac Main.java

    - name: Run Program
      run: java Main

    - name: Build Docker Image
      run: docker build -t devops-app .

    - name: Run Docker Container
      run: docker run devops-app

